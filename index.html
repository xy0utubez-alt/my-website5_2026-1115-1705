<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイページ">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>マイページ</title>
<style>
:root{
  --bg:#eceff3; --card:#fbfcfd; --ink:#16213a; --sub:#5a6578; --line:#d3d9e2;
  --accent:#2f5bd8; --accent-ink:#fff; --danger:#c8372d; --sat:#2f5bd8; --sun:#c8372d; --hover:#e4e9f1;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1420; --card:#171e2e; --ink:#e6ebf5; --sub:#98a3b8; --line:#2b3550;
        --accent:#7aa2ff; --accent-ink:#0f1420; --danger:#ff7a70; --sat:#7aa2ff; --sun:#ff7a70; --hover:#1f2840}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
input,textarea{font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px;outline:none;-webkit-appearance:none;appearance:none}
input[type=date],input[type=time]{min-width:0;display:block}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.muted{color:var(--sub);font-size:14px}

/* ログイン */
.auth{min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.auth form{width:100%;max-width:380px;display:grid;gap:12px}
.auth h1{margin:0 0 4px;font-size:26px;letter-spacing:.02em}
.msg{min-height:1.5em;font-size:14px;color:var(--danger);margin:0}
.msg.ok{color:var(--sub)}
.conn{margin:0;font-size:13px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;color:var(--sub);cursor:pointer}
.conn::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--sub)}
.conn.ok::before{background:#2e9e5b}
.conn.bad{color:var(--danger)}
.conn.bad::before{background:var(--danger)}

/* 全体 */
#app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "main" "nav";
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{grid-area:head;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0;font-size:18px;flex:1}
.status{font-size:13px;color:var(--sub)}
.status.err{color:var(--danger)}
nav{grid-area:nav;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;min-height:52px;border:0;background:none;cursor:pointer;color:var(--sub);font-size:11.5px;padding:0 1px;white-space:nowrap}
nav button[aria-current="true"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
main{grid-area:main;min-height:0;position:relative}
main>section{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#v-notes,#v-files,#v-py{overflow:hidden}
@media (min-width:768px){
  #app{grid-template-columns:180px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "nav main"}
  header{padding-top:12px}
  nav{flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:8px 0}
  nav button{flex:none;text-align:left;padding:0 20px;min-height:48px;font-size:14px}
  nav button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
}

/* 一覧+詳細(メモ・ファイル共通) */
.split{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.pl,.pd{min-height:0;display:flex;flex-direction:column}
.pd{display:none;padding:12px 16px;gap:10px;background:var(--card);overflow:auto;-webkit-overflow-scrolling:touch}
.split.open .pl{display:none}
.split.open .pd{display:flex}
.bar{display:flex;gap:8px;padding:12px 16px}
.items{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;display:grid;gap:6px;align-content:start}
.item{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer;display:block;width:100%;min-height:44px}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{display:block;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pd .title{font-weight:700;font-size:18px}
.pd textarea{flex:1;min-height:50vh;resize:none;line-height:1.7}
.back{display:inline-flex;align-items:center;justify-content:center}
.empty{margin:auto;color:var(--sub);text-align:center;padding:24px}
@media (min-width:768px){
  .split{grid-template-columns:320px minmax(0,1fr)}
  .pl{border-right:1px solid var(--line)}
  .pd{display:flex!important}
  .split.open .pl{display:flex}
  .back{display:none}
  .pd textarea{min-height:0}
}

/* ファイル */
.pv{display:grid;gap:10px}
.pv img,.pv video{max-width:100%;max-height:70vh;border-radius:8px;background:var(--bg)}
.pv audio{width:100%}
.pv iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.pv pre{margin:0;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;background:var(--bg);padding:12px;border-radius:8px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.drop{outline:2px dashed var(--accent);outline-offset:-8px}

/* カレンダー */
.cal{display:grid;gap:16px;padding:16px;grid-template-columns:minmax(0,1fr);align-content:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-head h2{margin:0;font-size:20px;flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{text-align:center;font-size:13px;color:var(--sub);padding:4px 0}
.dow:first-child,.day.sun{color:var(--sun)}
.dow:nth-child(7),.day.sat{color:var(--sat)}
.day{aspect-ratio:1/1;min-height:44px;border:1px solid transparent;border-radius:8px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.day.blank{background:none;cursor:default}
.day.today{border-color:var(--accent);font-weight:700}
.day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.panel h3{margin:0;font-size:17px}
.evrow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;cursor:pointer;min-height:44px}
.evrow .t{display:block;color:var(--sub);font-size:13px}
.evrow .n{display:block;word-break:break-word;font-weight:600}
.evrow .m{display:block;color:var(--sub);font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:3.2em;overflow:hidden}
.form{display:grid;gap:10px}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fld{display:grid;gap:4px;font-size:13px;color:var(--sub);min-width:0}
.form textarea{resize:vertical;line-height:1.6}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.frow .btn{flex:1}
@media (min-width:768px){.cal{grid-template-columns:minmax(0,1fr) 360px;max-width:1100px}}

/* 電卓 */
.calc{max-width:380px;margin:0 auto;padding:16px;display:grid;gap:12px}
.cdisp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:right;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cexpr{color:var(--sub);font-size:15px;min-height:1.5em;word-break:break-all}
.cres{font-size:36px;font-weight:600;line-height:1.2;word-break:break-all;font-variant-numeric:tabular-nums}
.ckeys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ck{min-height:60px;font-size:22px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.ck:active{background:var(--hover)}
.ck.op{color:var(--accent);font-weight:700}
.ck.fn{color:var(--sub);font-size:18px}
.ck.eq{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* ブックマーク */
.bm{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:12px;align-content:start}
.bm h3{margin:8px 0 0;font-size:14px;color:var(--sub);font-weight:600}
.bmi{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;margin-top:6px}
.bml{flex:1;min-width:0;color:inherit;text-decoration:none;display:block;padding:4px 0}
.bml b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bml span{display:block;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 認証タブ */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--hover);padding:4px;border-radius:10px}
.seg button{min-height:40px;border:0;border-radius:8px;background:none;cursor:pointer;color:var(--sub);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* アバター・アカウント */
.avatar{width:40px;height:40px;min-width:40px;border-radius:50%;border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-weight:700;overflow:hidden;padding:0;cursor:pointer;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:88px;height:88px;font-size:32px;cursor:default}
.acct{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:16px;align-content:start}
.acct .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* Pythonアプリ */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sub);margin-right:6px}
.dot.on{background:#2e9e5b}
.frame{width:100%;height:65vh;border:1px solid var(--line);border-radius:8px;background:#fff}
details.agent{border:1px solid var(--line);border-radius:8px;padding:4px 12px}
details.agent summary{cursor:pointer;min-height:40px;display:flex;align-items:center;color:var(--sub);font-size:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="auth" class="auth" hidden>
  <form id="authForm">
    <h1>マイページ</h1>
    <p id="conn" class="conn" role="status" title="タップで再確認"></p>
    <div class="seg" role="group" aria-label="ログインか新規登録か">
      <button type="button" id="tabLogin" aria-pressed="true">ログイン</button>
      <button type="button" id="tabSignup" aria-pressed="false">新規登録</button>
    </div>
    <input id="em" name="email" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email" placeholder="メールアドレス" required>
    <input id="un" name="nickname" autocomplete="nickname" placeholder="ユーザー名" hidden>
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
    <input id="p2" type="password" autocomplete="new-password" placeholder="パスワード(確認)" hidden>
    <p id="authMsg" class="msg" role="alert"></p>
    <button id="authBtn" class="btn primary" type="submit">ログイン</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1 id="pageTitle">メモ</h1>
    <span id="status" class="status" role="status"></span>
    <button id="avatarBtn" class="avatar" type="button" aria-label="アカウント設定"></button>
    <button id="logoutBtn" class="btn" type="button">ログアウト</button>
  </header>
  <nav id="nav" aria-label="メニュー">
    <button data-v="notes" aria-current="true">メモ</button>
    <button data-v="cal">予定</button>
    <button data-v="files">ファイル</button>
    <button data-v="calc">電卓</button>
    <button data-v="bm">リンク</button>
    <button data-v="py">アプリ</button>
  </nav>
  <main>
    <section id="v-notes"></section>
    <section id="v-cal" hidden></section>
    <section id="v-files" hidden></section>
    <section id="v-calc" hidden></section>
    <section id="v-bm" hidden></section>
    <section id="v-py" hidden></section>
    <section id="v-account" hidden></section>
  </main>
</div>

<script>
"use strict";
/* ============ 設定(ここだけ書き換える) ============ */
const SUPABASE_URL = "https://vbufowedksgbsafjoriq.supabase.co";
const SUPABASE_KEY = "sb_publishable_U7pk6AmmOBXxKBFZq2ejCA_omxK8KX3";
/* ================================================= */

const $ = s => document.querySelector(s);
const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
const libOk = typeof supabase !== "undefined";
const sb = configured && libOk ? supabase.createClient(SUPABASE_URL.trim(), SUPABASE_KEY.trim()) : null;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16) }));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt = t => new Date(t).toLocaleString("ja-JP", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
const fmtSize = n => n < 1048576 ? Math.max(1, Math.round(n/1024)) + "KB" : (n/1048576).toFixed(1) + "MB";
const SQL_HINT = "SQLの更新が必要です(supabase-update.sql / supabase-update-2.sql)";
const needsSql = err => /column|relation|schema cache|does not exist/i.test((err && err.message) || "");

function h(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==="class") e.className = v;
    else if(k==="value") e.value = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v===true) e.setAttribute(k,"");
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null) e.append(c);
  return e;
}
function setStatus(t, err){ const s=$("#status"); s.textContent=t; s.className="status"+(err?" err":"") }

/* ============ 状態 ============ */
let user = null, view = "notes";
const emptyState = () => ({ notes:[], events:[], files:[], bookmarks:[], pyapps:[], profile:{ username:"", avatar:"" } });
let state = emptyState();
let curNote = null, q = "", selFile = null;
let cal = (()=>{ const d=new Date(); d.setDate(1); return d })();
let sel = ymd(new Date());
let evEdit = null;          // null | "new" | 予定のid
let bmEdit = null, bmQ = ""; // null | "new" | ブックマークのid
const dirty = new Set(), saveT = {};
let loading = false, again = false, poll = null, chan = null, reloadT = null;

/* ============ 認証(ログイン / 新規登録) ============ */
let mode = "login", signupOpen = null;
function setMode(m){
  mode = m;
  const su = m === "signup";
  $("#tabLogin").setAttribute("aria-pressed", String(!su));
  $("#tabSignup").setAttribute("aria-pressed", String(su));
  $("#un").hidden = !su; $("#p2").hidden = !su;
  $("#un").required = su; $("#p2").required = su;
  $("#p").autocomplete = su ? "new-password" : "current-password";
  $("#em").autocomplete = su ? "email" : "username";
  $("#authBtn").textContent = su ? "登録する" : "ログイン";
  $("#authBtn").disabled = su && signupOpen === false;
  msg(su && signupOpen === false ? "現在、新規登録は受け付けていません。" : "");
}
$("#tabLogin").addEventListener("click", () => setMode("login"));
$("#tabSignup").addEventListener("click", () => setMode("signup"));

function showAuth(){
  $("#app").hidden = true; $("#auth").hidden = false;
  for(const id of ["#em","#un","#p","#p2"]) $(id).value = "";
  setMode("login"); checkConn();
}
function msg(t, ok){ const m=$("#authMsg"); m.textContent=t; m.className="msg"+(ok?" ok":"") }

/* 接続状態の表示 */
function setConn(kind, text){ const c=$("#conn"); c.className="conn"+(kind==="ok"?" ok":kind==="bad"?" bad":""); c.textContent=text }
async function checkConn(){
  if(!configured){ setConn("bad","未設定: index.html の SUPABASE_URL と SUPABASE_KEY を書き換えてください。"); return }
  if(!libOk){ setConn("bad","接続NG: Supabase のライブラリを読み込めません。ネット接続や広告ブロックを確認してください。"); return }
  setConn("wait","Supabase に接続を確認中…");
  try{
    const base = SUPABASE_URL.trim().replace(/\/+$/,"");
    const r = await fetch(base + "/auth/v1/settings", { headers:{ apikey:SUPABASE_KEY.trim() } });
    if(r.ok){
      const j = await r.json().catch(() => ({}));
      if(typeof j.disable_signup === "boolean") signupOpen = !j.disable_signup;
      setConn("ok", "Supabase に接続できています" + (signupOpen === false ? "(新規登録は停止中)" : ""));
      if(mode === "signup") setMode("signup");
    }
    else if(r.status===401 || r.status===403) setConn("bad", `接続NG: キー(SUPABASE_KEY)が正しくありません (HTTP ${r.status})`);
    else setConn("bad", `接続NG: HTTP ${r.status}。SUPABASE_URL が「https://xxxx.supabase.co」の形か確認してください。`);
  }catch{
    setConn("bad","接続NG: サーバーに届きません。SUPABASE_URL の綴り、ネット接続、プロジェクトの一時停止を確認してください。");
  }
}
$("#conn").addEventListener("click", checkConn);

function loginErrorText(err, email){
  const m = (err.message || "").toLowerCase();
  if(err.status===0 || err.name==="AuthRetryableFetchError" || /fetch|network/.test(m))
    return "Supabase に接続できません。上の接続表示を確認してください。";
  if(m.includes("email not confirmed"))
    return "メールアドレスの確認が済んでいません。届いた確認メールのリンクを開いてください。";
  if(m.includes("invalid login credentials"))
    return `メールアドレスまたはパスワードが違います(入力したメールアドレス: ${email})。`;
  return "ログインに失敗しました: " + err.message;
}
function signupErrorText(err){
  const m = (err.message || "").toLowerCase();
  if(err.status===0 || /fetch|network/.test(m)) return "Supabase に接続できません。上の接続表示を確認してください。";
  if(/not allowed|disabled/.test(m)) return "現在、新規登録は受け付けていません。";
  if(m.includes("already registered")) return "このメールアドレスは登録済みです。ログインしてください。";
  if(m.includes("rate limit")) return "短時間に送信しすぎです。しばらくしてからもう一度お試しください。";
  if(m.includes("email") && m.includes("invalid")) return "メールアドレスの形式が正しくありません。";
  if(m.includes("password")) return "パスワードの条件を満たしていません: " + err.message;
  return "登録に失敗しました: " + err.message;
}

$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!sb){ msg("Supabase に接続できる状態ではありません。上の表示を確認してください。"); return }
  const email = $("#em").value.trim().toLowerCase(), password = $("#p").value;
  const btn = $("#authBtn"); btn.disabled = true; msg("確認中…", true);
  try{
    if(mode === "signup") await doSignup(email, password);
    else await doLogin(email, password);
  }finally{ btn.disabled = mode === "signup" && signupOpen === false }
});
async function doLogin(email, password){

  msg(""); await enter(data.session.user);

async function doSignup(email, password){
  const username = $("#un").value.trim();
  if(!username){ msg("ユーザー名を入力してください。"); return }
  if(password.length < 8){ msg("パスワードは8文字以上にしてください。"); return }
  if(password !== $("#p2").value){ msg("確認用パスワードが一致しません。"); return }
  const { data, error } = await sb.auth.signUp({ email, password,
    options:{ data:{ username }, emailRedirectTo: location.origin + location.pathname } });
  if(error){ msg(signupErrorText(error)); return }
  if(data.session){ msg(""); await enter(data.session.user); return }
  if(data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){
    msg("このメールアドレスは登録済みです。ログインしてください。"); return;
  }
  setMode("login");
  msg("確認メールを送りました。メール内のリンクを開いてからログインしてください。", true);

/* ============ 同期 ============ */
async function reload(){
  if(!sb || !user) return;
  if(loading){ again = true; return }
  loading = true;
  try{
    const [a,b,c,d,e,f] = await Promise.all([
      sb.from("notes").select("*").order("updated_at",{ascending:false}),
      sb.from("events").select("*"),
      sb.from("files").select("*").order("created_at",{ascending:false}),
      sb.from("bookmarks").select("*").order("created_at",{ascending:false}),
      sb.from("pyapps").select("*").order("created_at",{ascending:true}),
      sb.from("profiles").select("*").maybeSingle()
    ]);
    if(a.error || b.error || c.error){ setStatus("同期に失敗しました", true); return }
    const local = new Map(state.notes.map(n => [n.id, n]));
    state.notes = a.data.map(n => dirty.has(n.id) && local.has(n.id) ? local.get(n.id) : n);
    for(const id of dirty){ const l = local.get(id); if(l && !state.notes.some(x => x.id===id)) state.notes.push(l) }
    state.events = b.data; state.files = c.data;
    state.bookmarks = d.error ? [] : d.data;
    state.pyapps = e.error ? [] : e.data;
    if(!f.error){
      if(f.data) state.profile = { username:f.data.username, avatar:f.data.avatar };
      else await sb.from("profiles").upsert({ user_id:user.id, username:state.profile.username });
    }
    drawAvatar();
    if(curNote && !state.notes.some(n => n.id===curNote)) curNote = null;
    if(selFile && !state.files.some(f => f.id===selFile)) selFile = null;
    if(evEdit && evEdit!=="new" && !state.events.some(e => e.id===evEdit)) evEdit = null;
    if(bmEdit && bmEdit!=="new" && !state.bookmarks.some(x => x.id===bmEdit)) bmEdit = null;
    if(pySel && !state.pyapps.some(x => x.id===pySel)) pySel = null;
    const oldSchema = d.error || e.error || f.error || (b.data.length > 0 && !("memo" in b.data[0]));
    if(oldSchema) setStatus(SQL_HINT, true);
    else if(!dirty.size) setStatus("同期済み");
    rerender();
  } finally {
    loading = false;
    if(again){ again = false; reload() }
  }
}
function typingIn(sec){
  const a = document.activeElement;
  return !!a && $(sec).contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName);
}
function rerender(){
  if(view==="notes"){ typingIn("#v-notes") ? renderList() : renderNotes() }
  else if(view==="cal"){ if(!typingIn("#v-cal")) renderCal() }
  else if(view==="files"){ renderFiles() }
  else if(view==="bm"){ if(!typingIn("#v-bm")) renderBm() }
  else if(view==="py"){ renderPyList() }
  else if(view==="account"){ if(!typingIn("#v-account")) renderAccount() }
}
function startSync(){
  stopSync();
  chan = sb.channel("mypage-sync").on("postgres_changes", {event:"*", schema:"public"}, () => {
    clearTimeout(reloadT); reloadT = setTimeout(reload, 300);
  }).subscribe();
  poll = setInterval(reload, 60000);
}
function stopSync(){ if(chan){ sb.removeChannel(chan); chan = null } clearInterval(poll); clearTimeout(reloadT) }
document.addEventListener("visibilitychange", () => {

async function flushNote(id){

/* ============ カレンダー(開始・終了・メモ、日またぎ対応) ============ */
const endOf = e => e.end_date || e.date;
const overlaps = (e, day) => e.date <= day && day <= endOf(e);
const byStart = (a, b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||""));
function evLabel(e){
  const end = endOf(e), md = d => { const [, m, dd] = d.split("-"); return `${+m}/${+dd}` };
  if(end === e.date){
    if(!e.time && !e.end_time) return "終日";
    return (e.time || "") + (e.end_time ? "–" + e.end_time : "");
  }
  return `${md(e.date)} ${e.time||""} → ${md(end)} ${e.end_time||""}`.replace(/\s+/g," ").trim();
}
function renderCal(){
  const root = $("#v-cal"); root.replaceChildren();

  for(let d=1; d<=days; d++){
    const date = ymd(new Date(y,m,d)), dow = new Date(y,m,d).getDay();
    const n = state.events.filter(e => overlaps(e, date)).length;

  }
  const move = n => { cal = new Date(y,m+n,1); renderCal() };
  const left = h("div",{},
    h("div",{class:"cal-head"},
      h("button",{class:"btn",type:"button","aria-label":"前の月",onclick:()=>move(-1)},"‹"),
      h("h2",{},`${y}年${m+1}月`),
      h("button",{class:"btn",type:"button",onclick:()=>{const t=new Date();cal=new Date(t.getFullYear(),t.getMonth(),1);sel=ymd(t);renderCal()}},"今日"),
      h("button",{class:"btn",type:"button","aria-label":"次の月",onclick:()=>move(1)},"›")),
    grid);

  const evs = state.events.filter(e => overlaps(e, sel)).sort(byStart);
  const label = new Date(sel+"T00:00").toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
  const editing = evEdit === "new" ? null : state.events.find(e => e.id === evEdit);
  const panel = h("div",{class:"panel"}, h("h3",{},label));
  if(evs.length){
    panel.append(h("div",{}, ...evs.map(e => h("button",{class:"evrow",type:"button",onclick:()=>{evEdit=e.id;renderCal()}},
      h("span",{class:"t"}, evLabel(e)),
      h("span",{class:"n"}, e.title),
      e.memo ? h("span",{class:"m"}, e.memo) : null))));
  } else if(!evEdit){
    panel.append(h("p",{class:"muted",style:"margin:0"},"この日の予定はありません。"));
  }
  if(evEdit) panel.append(eventForm(editing));
  else panel.append(h("button",{class:"btn primary",type:"button",onclick:()=>{evEdit="new";renderCal()}},"予定を追加"));
  root.append(h("div",{class:"cal"}, left, panel));

      ev ? h("button",{class:"btn danger",type:"button",onclick:del},"削除") : null));
}

/* ============ ファイル共有 ============ */
const ALLOWED = { pdf:"application/pdf", tex:"text/plain", mp3:"audio/mpeg", mp4:"video/mp4", jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png" };
const MAX_MB = 50;
const extOf = n => (n.split(".").pop() || "").toLowerCase();
const bucket = () => sb.storage.from("files");
const wide = () => matchMedia("(min-width:768px)").matches;

async function uploadFiles(list){
  let ok = 0;
  for(const f of list){
    const ext = extOf(f.name);
    if(!ALLOWED[ext]){ setStatus(`${f.name}: 対応していない形式です`, true); await sleep(1500); continue }
    if(f.size > MAX_MB*1048576){ setStatus(`${f.name}: ${MAX_MB}MBを超えています`, true); await sleep(1500); continue }
    setStatus(`アップロード中: ${f.name}`);
    const path = `${user.id}/${uid()}.${ext}`;
    const up = await bucket().upload(path, f, { contentType:ALLOWED[ext], upsert:false });
    if(up.error){ setStatus(`${f.name}: アップロードに失敗`, true); await sleep(1500); continue }
    const ins = await sb.from("files").insert({ path, name:f.name, size:f.size, mime:ALLOWED[ext] });
    if(ins.error){ await bucket().remove([path]); setStatus(`${f.name}: 登録に失敗`, true); await sleep(1500); continue }
    ok++;
  }
  if(ok) setStatus("アップロード完了");
  await reload();
}
async function signed(f, opts, sec = 3600){
  const { data, error } = await bucket().createSignedUrl(f.path, sec, opts);
  if(error) throw error;
  return data.signedUrl;
}
async function renameFile(f){
  const ext = extOf(f.name);
  let nn = prompt("新しいファイル名", f.name);
  if(nn == null) return;
  nn = nn.trim().replace(/[\\/]/g, "_");
  if(!nn) return;
  if(!nn.includes(".")) nn += "." + ext;
  const ne = extOf(nn), same = ne === ext || (["jpg","jpeg"].includes(ne) && ["jpg","jpeg"].includes(ext));
  if(!same){ setStatus(`拡張子は .${ext} のまま変更できません`, true); return }
  if(nn === f.name) return;
  const old = f.name; f.name = nn; renderFiles();
  const { error } = await sb.from("files").update({ name:nn }).eq("id", f.id);
  if(error){ f.name = old; renderFiles(); setStatus("名前を変更できませんでした", true) } else setStatus("名前を変更しました");
}

/* ============ 電卓 ============ */
const calc = { expr:"", hist:"", show:"", done:false, err:false };
const OPS = "+−×÷";
function evalExpr(src){
  let s = src.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  const open = (s.match(/\(/g)||[]).length - (s.match(/\)/g)||[]).length;
  if(open > 0) s += ")".repeat(open);
  let i = 0;
  const peek = () => s[i];
  function expr(){ let v = term(); while(peek()==="+"||peek()==="-"){ const o = s[i++]; const r = term(); v = o==="+" ? v+r : v-r } return v }
  function term(){ let v = unary(); while(peek()==="*"||peek()==="/"){ const o = s[i++]; const r = unary(); v = o==="*" ? v*r : v/r } return v }
  function unary(){ if(peek()==="-"){ i++; return -unary() } if(peek()==="+"){ i++; return unary() } return post() }
  function post(){ let v = prim(); while(peek()==="%"){ i++; v /= 100 } return v }
  function prim(){
    if(peek()==="("){ i++; const v = expr(); if(peek()!==")") throw 0; i++; return v }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if(!m) throw 0;
    i += m[0].length; return parseFloat(m[0]);
  }
  const v = expr(); if(i !== s.length) throw 0; return v;
}
const tryEval = s => { try{ return evalExpr(s) }catch{ return null } };
const normNum = n => String(parseFloat(n.toPrecision(12)));
function showNum(n){
  if(!isFinite(n)) return "エラー";
  const s = normNum(n); if(/e/i.test(s)) return s;
  const [i, d] = s.split("."), neg = i.startsWith("-"), ii = (neg ? i.slice(1) : i).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + ii + (d ? "." + d : "");
}
function calcPress(k){
  let expr = calc.expr; const last = expr.slice(-1);
  if(k !== "=") calc.err = false;
  if(/^\d$/.test(k) || k === "."){
    if(calc.done){ expr = ""; calc.done = false }
    const cur = expr.slice(-1);
    if(k === "."){
      const run = /[\d.]*$/.exec(expr)[0]; if(run.includes(".")) return;
      if(run === ""){ if(cur===")" || cur==="%") expr += "×"; expr += "0" }
    } else if(cur===")" || cur==="%") expr += "×";
    expr += k;
  } else if(OPS.includes(k)){
    calc.done = false;
    if(OPS.includes(last)){
      const prev = expr.slice(-2,-1);
      if((prev === "" || prev === "(") && k !== "−") return;
      expr = expr.slice(0,-1) + k;
    } else if(last === "(" || expr === ""){ if(k === "−") expr += k }
    else expr += k;
  } else if(k === "("){
    if(calc.done){ expr = ""; calc.done = false }
    else if(/[\d.)%]$/.test(expr)) expr += "×";
    expr += "(";
  } else if(k === ")"){
    const open = (expr.match(/\(/g)||[]).length - (expr.match(/\)/g)||[]).length;
    if(open > 0 && /[\d.)%]$/.test(expr)) expr += ")";
  } else if(k === "%"){
    if(/[\d.)%]$/.test(expr)){ expr += "%"; calc.done = false }
  } else if(k === "⌫"){ expr = expr.slice(0,-1); calc.done = false }
  else if(k === "AC"){ expr = ""; calc.done = false; calc.hist = "" }
  else if(k === "="){
    if(!expr) return;
    const v = tryEval(expr);
    if(v === null || !isFinite(v)){ calc.err = true }
    else {
      calc.err = false; calc.hist = expr + " =";
      calc.show = showNum(v);
      const n = normNum(v);
      expr = /e/i.test(n) ? "" : n.replace("-", "−");
      calc.done = true;
    }
  }
  calc.expr = expr; calcUpdate();
}
function calcUpdate(){
  const a = $("#calcExpr"), b = $("#calcRes"); if(!a) return;
  if(calc.err){ a.textContent = calc.expr; b.textContent = "エラー"; return }
  if(calc.done){ a.textContent = calc.hist; b.textContent = calc.show; return }
  a.textContent = calc.expr;
  const v = /[+−×÷%()]/.test(calc.expr.slice(1)) ? tryEval(calc.expr) : null;
  b.textContent = v !== null && isFinite(v) ? showNum(v) : (calc.expr || "0");
}
function renderCalc(){
  const root = $("#v-calc"); root.replaceChildren();
  const keys = [["AC","⌫","(",")"],["7","8","9","÷"],["4","5","6","×"],["1","2","3","−"],["0",".","%","+"]];
  const grid = h("div",{class:"ckeys"});
  for(const row of keys) for(const k of row){
    grid.append(h("button",{type:"button",class:"ck"+(OPS.includes(k)?" op":"")+((k==="AC"||k==="⌫")?" fn":""),
      "aria-label":k==="⌫"?"1文字消す":k==="AC"?"すべて消す":k, onclick:()=>calcPress(k)}, k));
  }
  grid.append(h("button",{type:"button",class:"ck eq",onclick:()=>calcPress("=")},"="));
  root.append(h("div",{class:"calc"}, h("div",{class:"cdisp"}, h("div",{id:"calcExpr",class:"cexpr"}), h("div",{id:"calcRes",class:"cres"})), grid));
  calcUpdate();
}
document.addEventListener("keydown", e => {
  if(view !== "calc" || !user || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = document.activeElement && document.activeElement.tagName;
  if(t === "INPUT" || t === "TEXTAREA") return;
  const map = { "*":"×", "/":"÷", "-":"−", "Enter":"=", "Backspace":"⌫", "Escape":"AC", "c":"AC", "C":"AC" };
  const k = map[e.key] || e.key;
  if(/^[0-9.+−×÷()%=]$/.test(k) || k === "⌫" || k === "AC"){ e.preventDefault(); calcPress(k) }
});

function resizeImage(file, size = 128){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("load")) };
    img.src = url;
  });
}

    return;
  }
  const url = a.url ? normalizeUrl(a.url) : null;
  let area;
  if(!url) area = h("p",{class:"muted"},"アプリのアドレスが未設定です。「編集」から入力してください。");
  else if(frameBlocked(url)) area = h("p",{class:"muted"},"http のアドレスは、https のこのページの中には表示できません。「新しいタブで開く」を使ってください。");
  else if(!pyShow) area = h("p",{class:"muted"},"「起動」または「枠に表示」で、ここにアプリが表示されます。");
  else area = h("iframe",{class:"frame",src:url,title:a.name,referrerpolicy:"no-referrer",
    sandbox:"allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"});
  box.append(
    h("div",{class:"row"},
      h("button",{class:"btn back",type:"button",onclick:()=>{pySel=null;renderPy()}},"戻る"),
      h("strong",{style:"flex:1;word-break:break-all"}, a.name)),
    h("div",{id:"pybar",class:"muted"}),
    h("div",{class:"row"},
      h("button",{class:"btn primary",type:"button",onclick:()=>pyAction(a,"start")},"起動"),
      h("button",{class:"btn",type:"button",onclick:()=>pyAction(a,"stop")},"停止"),
      h("button",{class:"btn",type:"button",onclick:()=>{pyShow=true;renderPyDetail()}},"枠に表示"),
      url ? h("button",{class:"btn",type:"button",onclick:()=>window.open(url,"_blank","noopener")},"新しいタブで開く") : null,
      h("button",{class:"btn",type:"button",onclick:()=>{pyEdit=a.id;renderPyDetail()}},"編集")),
    a.memo ? h("p",{class:"muted",style:"margin:0;white-space:pre-wrap"}, a.memo) : null,
    area, agentSettings());
  renderPyBar();
}
function pyForm(a){
  const base = a || { id:uid(), name:"", url:"", memo:"" };
  const f = {
    name: h("input",{placeholder:"登録名(ランチャーに登録した名前と同じ)",value:base.name,"aria-label":"登録名"}),
    url: h("input",{placeholder:"アプリのアドレス(例: http://localhost:5000)",value:base.url,inputmode:"url",autocapitalize:"none",autocorrect:"off",spellcheck:"false","aria-label":"アドレス"}),
    memo: h("textarea",{rows:"3",placeholder:"メモ(任意)",value:base.memo,"aria-label":"メモ"})
  };
  const err = h("p",{class:"msg",role:"alert"});
  const save = async () => {
    const name = f.name.value.trim(); if(!name){ err.textContent = "登録名を入力してください。"; return }
    let url = ""; if(f.url.value.trim()){ url = normalizeUrl(f.url.value) || ""; if(!url){ err.textContent = "アドレスは http または https で入力してください。"; return } }
    const obj = { id:base.id, name, url, memo:f.memo.value };
    const i = state.pyapps.findIndex(x => x.id === obj.id);
    if(i >= 0) state.pyapps[i] = { ...state.pyapps[i], ...obj }; else state.pyapps.push({ ...obj, created_at:new Date().toISOString() });
    pySel = obj.id; pyEdit = null; pyShow = false; renderPy();
    const { error } = await sb.from("pyapps").upsert(obj);
    if(error){ setStatus(needsSql(error) ? SQL_HINT : "保存に失敗しました", true); reload() }
  };
  const del = async () => {
    if(!confirm("この登録を削除しますか?(PC上のアプリのファイルは消えません)")) return;
    state.pyapps = state.pyapps.filter(x => x.id !== base.id); pySel = null; pyEdit = null; renderPy();
    const { error } = await sb.from("pyapps").delete().eq("id", base.id);
    if(error){ setStatus("削除に失敗しました", true); reload() }
  };
  return h("div",{class:"form"},
    h("div",{class:"row"}, h("button",{class:"btn back",type:"button",onclick:()=>{pyEdit=null;renderPy()}},"戻る"),
      h("strong",{style:"flex:1"}, a ? "登録内容を編集" : "アプリを登録")),
    f.name, f.url, f.memo, err,
    h("div",{class:"frow"},
      h("button",{class:"btn primary",type:"button",onclick:save},"保存"),
      h("button",{class:"btn",type:"button",onclick:()=>{pyEdit=null;renderPy()}},"キャンセル"),
      a ? h("button",{class:"btn danger",type:"button",onclick:del},"削除") : null));
}
</script>
</body>
